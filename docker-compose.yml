version: '3.8'

services:
  # 1. PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: videoplatform_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: videoplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videoplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: videoplatform_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/videoplatform
      JWT_SECRET: super_secure_video_platform_jwt_secret_key_2026
      JWT_REFRESH_SECRET: super_secure_video_platform_refresh_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Flutter Web Frontend Service (Nginx)
  frontend:
    build:
      context: ./mobile-app
      dockerfile: Dockerfile
    container_name: videoplatform_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
